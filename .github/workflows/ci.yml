name: 🔍 CI

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.x.x"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run unit tests
        run: pnpm test

      - name: Run consumer typecheck
        run: pnpm test:consumer-types

  lint-and-build:
    name: 🧹 Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run Biome
        run: pnpm check

      - name: Run Stylelint
        run: pnpm lint:css

      - name: Check dependencies
        run: pnpm check:deps

      - name: Verify build
        run: pnpm docs:build

  accessibility:
    name: 🌐 Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build docs site
        run: pnpm docs:build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run accessibility tests
        run: pnpm test:accessibility

  compatibility:
    name: ⭐ Starlight ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "0.32 / Astro 5"
            starlight: "0.32"
            astro: "5"
          - name: "0.38 / Astro 6"
            starlight: "0.38"
            astro: "6"
          - name: "0.41 / Astro 7"
            starlight: "0.41"
            astro: "7"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Create smoke test project
        run: |
          mkdir -p /tmp/compat-test/src/content/docs
          cat > /tmp/compat-test/astro.config.ts << 'CONF'
          import { defineNorthwesternConfig } from "@nu-appdev/northwestern-starlight-theme/config";
          export default defineNorthwesternConfig({
              starlight: {
                  title: "Compat Test",
              },
          });
          CONF
          cat > /tmp/compat-test/src/content.config.ts << 'CONTENT'
          import { defineCollection } from "astro:content";
          import { docsLoader } from "@astrojs/starlight/loaders";
          import { docsSchema } from "@astrojs/starlight/schema";

          export const collections = {
              docs: defineCollection({ loader: docsLoader(), schema: docsSchema() }),
          };
          CONTENT
          cat > /tmp/compat-test/src/content/docs/index.md << 'PAGE'
          ---
          title: Test
          ---
          Hello world.

          | Version | Supported |
          | --- | --- |
          | Astro ${{ matrix.astro }} | Yes |

          ```mermaid
          flowchart LR
              Astro --> Starlight --> Northwestern
          ```
          PAGE
          cat > /tmp/compat-test/package.json << 'PKG'
          { "type": "module" }
          PKG
          cd /tmp/compat-test
          pnpm add @astrojs/starlight@${{ matrix.starlight }} astro@${{ matrix.astro }} astro-mermaid@2 mermaid@11
          pnpm add @nu-appdev/northwestern-starlight-theme@file:${{ github.workspace }}/packages/northwestern-starlight-theme

      - name: Verify build
        working-directory: /tmp/compat-test
        run: |
          npx astro build
          node --input-type=module << 'CHECK'
          import { readFile } from "node:fs/promises";

          const html = await readFile("dist/index.html", "utf8");
          const expectedFragments = ['<pre class="mermaid"', 'class="nu-table-scroll"'];

          for (const fragment of expectedFragments) {
              if (!html.includes(fragment)) {
                  throw new Error(`Expected generated page to contain ${fragment}`);
              }
          }
          CHECK
